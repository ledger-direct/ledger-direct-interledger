name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only read this repository: they install dependencies and run tests,
# and nothing here writes back.
permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        stability: [prefer-lowest, prefer-stable]

    steps:
      # The checkout token is not needed after cloning, and `composer update` and
      # the test suite run third-party code that would otherwise find it on disk.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, bcmath
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/phpunit
